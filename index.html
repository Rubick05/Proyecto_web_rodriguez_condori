<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Slides - Editor Interactivo Simple y Sencillo</title>
  <meta name="description" content="Editor de diapositivas web interactivo, simple y sencillo con W3.CSS, Vanilla JS, persistencia en IndexedDB y LocalStorage.">
  
  <!-- Hojas de Estilos Modulares: W3.CSS, Base y Componentes -->
  <link rel="stylesheet" href="css/w3.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- Barra Superior / Header de la Aplicación -->
  <header class="app-header" id="app-header">
    <div class="brand-section">
      <div class="brand-logo" id="brand-logo">
        <span>✨ Web Slides</span>
        <span class="brand-badge">W3.CSS + IDB</span>
      </div>
      <input type="text" id="presentation-title" class="presentation-title-input" value="Web Slides Simples" title="Haz clic para renombrar la presentación" placeholder="Título de la presentación">
    </div>

    <!-- Acciones de Gestión de Diapositivas y Guardado -->
    <div class="header-right-actions">
      <button class="btn-icon btn-primary" id="add-slide-btn" title="Añadir una nueva diapositiva">
        <span>➕</span> <span>Añadir Diapositiva</span>
      </button>

      <button class="btn-icon btn-danger" id="delete-slide-btn" title="Borrar la diapositiva actual">
        <span>🗑️</span> <span>Borrar</span>
      </button>

      <!-- Indicador de guardado automático en IndexedDB -->
      <div class="save-status-indicator" id="save-status">
        <span class="status-dot"></span> <span>Guardado en IndexedDB</span>
      </div>
    </div>
  </header>

  <!-- Cinta de Formato: Color de Texto, Tipo de Fuente y Tamaño de Fuente Enfocado al Elemento Seleccionado -->
  <nav class="format-ribbon" aria-label="Herramientas de personalización">
    <!-- 1. Color de Texto -->
    <div class="ribbon-group">
      <span class="ribbon-label">Color de Texto</span>
      <label class="color-picker-wrapper" title="Seleccionar color de texto">
        <div class="color-swatch-circle" id="text-swatch-preview" style="background: #0f172a;"></div>
        <input type="color" id="slide-text-color" class="color-input-native" value="#0f172a">
      </label>
    </div>

    <!-- 2. Elemento Seleccionado (Título o Contenido) -->
    <div class="ribbon-group">
      <span class="ribbon-label">Elemento</span>
      <span class="target-indicator-badge" id="target-indicator-badge" title="Haz clic en el título o en el contenido del slide para seleccionarlo">Título</span>
    </div>

    <!-- 3. Tipo de Fuente del Elemento Seleccionado -->
    <div class="ribbon-group">
      <span class="ribbon-label">Fuente</span>
      <select id="font-family-select" class="font-select" title="Cambiar tipografía del elemento seleccionado">
        <option value="'Inter', sans-serif">Inter (Moderna)</option>
        <option value="'Outfit', sans-serif">Outfit (Impacto)</option>
        <option value="'JetBrains Mono', monospace">JetBrains Mono (Código)</option>
        <option value="Georgia, serif">Georgia (Elegante)</option>
        <option value="Verdana, sans-serif">Verdana (Clásica)</option>
      </select>
    </div>

    <!-- 4. Tamaño de Fuente del Elemento Seleccionado -->
    <div class="ribbon-group">
      <span class="ribbon-label">Tamaño</span>
      <select id="font-size-select" class="font-select" title="Seleccionar tamaño de fuente del elemento seleccionado">
        <option value="16px">16px</option>
        <option value="18px">18px</option>
        <option value="20px">20px</option>
        <option value="24px">24px</option>
        <option value="28px">28px</option>
        <option value="34px">34px</option>
        <option value="36px" selected>36px</option>
        <option value="40px">40px</option>
        <option value="48px">48px</option>
        <option value="56px">56px</option>
        <option value="64px">64px</option>
      </select>
      <button class="ribbon-btn" id="font-decrease-btn" title="Reducir tamaño del elemento seleccionado">A-</button>
      <button class="ribbon-btn" id="font-increase-btn" title="Aumentar tamaño del elemento seleccionado">A+</button>
    </div>

    <!-- 4. Formato / Tamaño de Diapositiva (16:9 vs 4:3) -->
    <div class="ribbon-group" style="border-right: none;">
      <span class="ribbon-label">Formato</span>
      <select id="aspect-ratio-select" class="font-select" title="Cambiar proporción de la diapositiva seleccionada">
        <option value="16/9" selected>Widescreen (16:9)</option>
        <option value="4/3">Standard (4:3)</option>
      </select>
    </div>
  </nav>

  <!-- Espacio de Trabajo Principal -->
  <main class="app-workspace">
    <!-- Panel Lateral: Miniaturas de Diapositivas para Selección -->
    <aside class="slides-sidebar" id="slides-sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Diapositivas</span>
        <button class="btn-icon" id="sidebar-add-btn" style="padding: 2px 8px; font-size: 0.75rem;" title="Añadir Diapositiva">
          ➕ Añadir
        </button>
      </div>
      <div class="thumbnails-list" id="thumbnails-list">
        <!-- Renderizado dinámicamente por SidebarComponent -->
      </div>
    </aside>

    <!-- Escenario Central: Lienzo de la Diapositiva 16:9 -->
    <section class="slide-stage-container" id="slide-stage-container">
      <div class="slide-viewport slide-animate-fade" id="slide-viewport">
        <!-- Contenedor del contenido interactivo de la diapositiva -->
        <div id="slide-content-wrapper" style="width: 100%; height: 100%;">
          <!-- Renderizado dinámicamente: Título arriba centrado y Contenido centrado al medio -->
        </div>
        <!-- Barra de Progreso Inferior -->
        <div class="slide-progress-bar" id="slide-progress-bar"></div>
      </div>

      <!-- Barra Flotante de Navegación Inferior -->
      <footer class="stage-footer-nav" id="stage-footer-nav">
        <button class="nav-arrow-btn" id="prev-slide-btn" title="Diapositiva anterior (Flecha Izquierda)">
          ◀
        </button>
        <span class="nav-counter" id="nav-counter">
          <span id="current-slide-num">1</span> / <span id="total-slides-num">1</span>
        </span>
        <button class="nav-arrow-btn" id="next-slide-btn" title="Siguiente diapositiva (Flecha Derecha o Espacio)">
          ▶
        </button>
      </footer>
    </section>
  </main>

  <!-- Notificación Flotante Toast -->
  <aside class="toast-notice" id="toast-notice" role="status" aria-live="polite">
    <span>💡</span>
    <span id="toast-message">Notificación</span>
  </aside>

  <!-- Módulo Principal ES6 con Arquitectura Limpia (SRP) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
